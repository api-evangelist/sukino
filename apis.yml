name: Sukino
description: 'Sukino Healthcare is a Bangalore, India-based continuum-of-care provider
  specializing in post-hospitalization recovery, rehabilitation, and transitional care
  for seniors and patients with chronic and neurological conditions. Founded by Rajinish
  Menon, it operates in-patient continuum care centers alongside home healthcare services,
  covering neuro, stroke, and knee-replacement rehabilitation, transitional care, and
  palliative care. Surfaced as a portfolio company of Bessemer Venture Partners and
  added to the API Evangelist network, Sukino is a healthcare services operator and
  publishes no public API, developer portal, or machine-readable specification at this
  time; this profile captures its identity and web presence for network discovery.'
